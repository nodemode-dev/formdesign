# FormDesign for Codex in this repository (trusted projects only). From any folder: ./formdesign agents install codex.
[mcp_servers.formdesign]
command = "sh"
args = ["-c", "exec \"$(git rev-parse --show-toplevel 2>/dev/null || pwd)/formdesign\" mcp"]
startup_timeout_sec = 90
tool_timeout_sec = 600
