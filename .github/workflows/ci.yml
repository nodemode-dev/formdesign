name: ci

on:
  push:
    branches: [main, 'compile_v*']
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app formdesign_engine.py
      - run: python formdesign_engine.py --selfcheck
      - name: Template library lints clean
        run: |
          python - <<'PY'
          import sys
          from app.templates import spec
          lib = spec.load_all()
          bad = {tid: p for tid, t in lib.items() if not t.get('_user') and (p := spec.problems(t))}
          for tid, p in bad.items():
              print(tid, p)
          print(len(lib), 'templates,', len(bad), 'with problems')
          sys.exit(1 if bad else 0)
          PY
      - name: Agent skills in step with the engine
        run: python ../setup/agents.py sync --check
      - name: Boot the engine and probe it
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8196 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8196/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8196/api/capabilities
          curl -sf http://127.0.0.1:8196/api/templates > /dev/null

  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install the engine, the font library and the layout core
        run: |
          ( cd backend && ./oc_install )
          ./formdesign install-fonts
          ./formdesign install-core
      - name: Lay out a newsletter and a flyer from the command line
        run: |
          mkdir -p "$RUNNER_TEMP/make"
          printf '# Spring in the beds\n\nThe club met on Saturday to plant the new herb garden.\n\nVolunteers brought cuttings, compost and coffee.\n' > "$RUNNER_TEMP/make/story.md"
          ./formdesign make --brief "a two page newsletter for the Elm Street garden club" "$RUNNER_TEMP/make/story.md" --out "$RUNNER_TEMP/make/newsletter.pdf" --out "$RUNNER_TEMP/make/newsletter.fdes"
          ./formdesign make --brief "a flyer for a bake sale on Saturday at 10am. CTA: Bring a friend" --out "$RUNNER_TEMP/make/flyer.png"
          for f in newsletter.pdf newsletter.fdes flyer.png; do test -s "$RUNNER_TEMP/make/$f"; done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install the engine, the font library and the layout core
        run: |
          ( cd backend && ./oc_install )
          ./formdesign install-fonts
          ./formdesign install-core
      - name: Layout core tests
        working-directory: native
        run: cargo test --release --locked -p formdesign-engine
      - name: Engine tests
        working-directory: backend
        run: |
          venv/bin/pip install -r requirements-test.txt
          venv/bin/python -m pytest tests -q

  window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install the engine, the font library and the layout core
        run: |
          ( cd backend && ./oc_install )
          ./formdesign install-fonts
          ./formdesign install-core
      - name: Build the window
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Playwright and its Chromium
        run: |
          backend/venv/bin/pip install pytest==9.1.1 playwright==1.63.0
          backend/venv/bin/python -m playwright install --with-deps chromium
      - name: Window smoke (F7)
        env:
          FORMDESIGN_CORE: ${{ github.workspace }}/native/target/release/formdesign-core
        run: backend/venv/bin/python -m pytest frontend/tests/window -q -p no:cacheprovider

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for f in formdesign backend/oc_install frontend/oc_install setup/*; do
            case "$f" in *.bat|*.py) continue ;; esac
            bash -n "$f"
          done
      - name: No em dash in tracked markdown, no emoji in tracked text
        run: |
          python3 - <<'PY'
          import subprocess, sys
          bad = []
          for path in subprocess.check_output(['git', 'ls-files'], text=True).split():
              try:
                  text = open(path, encoding='utf-8').read()
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              markdown = path.endswith('.md')
              for ch in text:
                  cp = ord(ch)
                  if (markdown and cp == 0x2014) or 0x1F000 <= cp <= 0x1FAFF or 0x2600 <= cp <= 0x27BF:
                      bad.append(f'{path}: U+{cp:04X}')
                      break
          print('\n'.join(bad) or 'clean')
          sys.exit(1 if bad else 0)
          PY
