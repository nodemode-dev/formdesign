name: desktop

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: linux-x64
            os: ubuntu-22.04
          - name: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            src-tauri
      - name: Linux webview packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install the engine, the layout core, the fonts and the desktop toolchain
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./formdesign install
          ./formdesign install-desktop
      - name: Install the engine, the layout core, the fonts and the desktop toolchain (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call formdesign.bat install || exit /b 1
          call formdesign.bat install-desktop || exit /b 1
      - name: Build the desktop bundle
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          [ -n "$APPLE_ID" ] || unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fd() { if [ "$RUNNER_OS" = Windows ]; then cmd //d //c "formdesign.bat $*"; else ./formdesign "$@"; fi; }
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            fd desktop build --config src-tauri/tauri.updater.conf.json
          else
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            fd desktop build
          fi
      - name: Stage the bundles and the layout core
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p out
          b=src-tauri/target/release/bundle
          for f in $b/dmg/*.dmg $b/appimage/*.AppImage* $b/deb/*.deb $b/rpm/*.rpm $b/msi/*.msi* $b/nsis/*.exe*; do cp "$f" out/; done
          for f in $b/macos/*.app.tar.gz*; do n="$(basename "$f")"; cp "$f" "out/${n/.app.tar.gz/_${{ matrix.name }}.app.tar.gz}"; done
          for f in src-tauri/binaries/formdesign-core-*; do cp "$f" out/; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: formdesign-${{ matrix.name }}
          if-no-files-found: error
          path: out/*

  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: The layout core for Intel Macs
        run: |
          cd native
          cargo build --release -p formdesign-core --target x86_64-apple-darwin
          mkdir -p ../out
          cp target/x86_64-apple-darwin/release/formdesign-core ../out/formdesign-core-x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: formdesign-core-macos-x64
          if-no-files-found: error
          path: out/*

  release:
    needs: [build, core]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Updater feed (latest.json)
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os
          tag = os.environ['GITHUB_REF_NAME']
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"
          targets = {'darwin-aarch64': '*_macos-arm64.app.tar.gz', 'linux-x86_64': '*.AppImage', 'windows-x86_64': '*-setup.exe'}
          platforms = {}
          for key, pattern in targets.items():
              for f in sorted(glob.glob('bundles/' + pattern)):
                  if os.path.exists(f + '.sig'):
                      platforms[key] = {'signature': open(f + '.sig').read().strip(), 'url': base + os.path.basename(f)}
                      break
          if platforms:
              feed = {'version': tag.lstrip('v'), 'notes': f'FormDesign {tag}', 'platforms': platforms,
                      'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}
              json.dump(feed, open('bundles/latest.json', 'w'), indent=2)
              print('latest.json written for', ', '.join(platforms))
          else:
              print('no updater signatures (TAURI_SIGNING_PRIVATE_KEY unset); latest.json not written')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: bundles/*
