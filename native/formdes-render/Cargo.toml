[package]
name = "formdes-render"
description = "formdes output: page scenes, raster rendering and PDF export for formdes's own engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
formdes-model = { path = "../formdes-model" }
formdes-text = { path = "../formdes-text" }
kurbo = { workspace = true }
serde_json = { workspace = true }
skrifa = "0.46"
vello_cpu = { version = "0.2", default-features = false, features = ["std", "png", "u8_pipeline"] }
krilla = { version = "0.8", default-features = false, features = ["raster-images", "pdf"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
hayro = "0.7"
pdf-writer = "0.15"

[lints.rust]
unsafe_code = "forbid"
