[package]
name = "formdesign"
version = "0.87.0"
description = "FormDesign desktop shell"
authors = ["nodemode-ai"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
regex = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# The native canvas (opt-in, View > Renderer > Native): wgpu composition of the page tiles, started by native_canvas_start.
formdesign-gpu = { path = "../native/formdesign-gpu" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder", "objc2-core-foundation", "NSColor"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = false

[profile.release.build-override]
strip = false
